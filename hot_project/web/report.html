<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>__REPORT_TITLE__</title>
  <link rel="stylesheet" href="/web/report.css?v=__ASSET_VER__">
  <script src="/web/common.js?v=__ASSET_VER__" defer></script>
  <script src="/web/user.js?v=__ASSET_VER__" defer></script>
  <script src="/web/favorites.js?v=__ASSET_VER__" defer></script>
  <script src="/web/report.js?v=__ASSET_VER__" defer></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="项目目录">
      <div class="sidebar__head">
        <a href="/chat" class="sidebar__back">← 返回聊天</a>
        <span class="sidebar__name">__REPORT_NAME__</span>
      </div>
      <div class="sidebar__search">
        <input type="search" id="repo-search" placeholder="搜索项目 / 语言 / 标签…"
               autocomplete="off" spellcheck="false" aria-label="搜索项目">
        <span class="sidebar__count" id="repo-count"></span>
      </div>
      <div class="sidebar__scroll" id="sidebar-scroll">
        __REPORT_TOC_HTML__
      </div>
      <div class="sidebar__resizer" id="sidebar-resizer" role="separator"
           aria-orientation="vertical" aria-label="拖拽调整目录宽度" title="拖拽调整宽度"></div>
    </aside>

    <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>

    <main class="main">
      <header class="hero">
        <span class="hero__eyebrow">GitHub Hot Projects · __REPORT_NAME__</span>
        <h1>__REPORT_TITLE__</h1>
        __REPORT_SUMMARY_HTML__
      </header>

      <article class="content" id="content">
        __REPORT_ARTICLE_HTML__
      </article>

      <div class="pager" id="pager" hidden>
        <button type="button" class="pager__btn" id="pager-prev">← 上一个</button>
        <span class="pager__pos" id="pager-pos"></span>
        <button type="button" class="pager__btn" id="pager-next">下一个 →</button>
      </div>

      <div class="footer">GitHub Hot Projects · Report View</div>
    </main>
  </div>

  <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-label="打开项目目录">
    <span></span><span></span><span></span>
  </button>
</body>
</html>
