name: weekly report

# 周三 10:30 北京 = 周三 02:30 UTC(GitHub 的 cron 一律按 UTC 解释)。
# 刻意排在每日快照之后:候选池是 DB 全库,等当天的发现阶段入库,本周新冒出来的爆款才赶得上
# 这一期。每日 00:23 触发 + 排队延迟 + 约 55 分钟,02:30 有富余;真拖过头了 concurrency 兜底。

on:
  schedule:
    - cron: "30 2 * * 3"
  workflow_dispatch:
    inputs:
      top_n:
        description: "取前 N 个项目（留空用默认 100）"
        type: string
        default: ""
      growth_calc_days:
        description: "增长计算窗口天数（留空用默认 7）"
        type: string
        default: ""

permissions:
  contents: write

# group 和每日快照共用:两个 workflow 都往 main 写 Github_DB.json,而 commit_and_push.sh
# 是「以本次产物为准」的重放、不做内容合并 —— 同时跑的话后推的那个会整份盖掉先推的
# (周报的 LLM 描述被抹 / 当天新发现的仓库回退)。排队让后跑的那个 checkout 到前者的结果。
concurrency:
  group: main-data-write
  cancel-in-progress: false

jobs:
  report:
    if: github.repository == 'bachelor-dou/Agent-skils'
    runs-on: ubuntu-latest
    # 为限流退避预留执行时间。
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4
        with:
          # 检出 main:每日快照攒在 main 上,是增长基线的唯一来源,拿不到就出不了榜。
          ref: main
        # 默认浅克隆:29MB 的 Github_DB.json 只下最新一版

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-ci.txt

      - name: 出榜
        env:
          GITHUB_TOKENS: ${{ secrets.GH_STAR_TOKENS }}
          # 只给 A、C 两个平台 = 两层顺序回退;其余平台 key 为空会被自动跳过,不必改 config。
          LLM_A_KEY: ${{ secrets.LLM_A_KEY }}
          LLM_C_KEY: ${{ secrets.LLM_C_KEY }}
          # 没配就是空串,代码跳过推送,不影响出榜
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          python -m hot_project.cron_weekly_report \
            ${{ inputs.top_n && format('--top-n {0}', inputs.top_n) || '' }} \
            ${{ inputs.growth_calc_days && format('--growth-days {0}', inputs.growth_calc_days) || '' }}

      - name: 提交并推送 DB 与报告
        run: |
          bash .github/scripts/commit_and_push.sh \
            "chore: weekly hot projects report $(date -u +%Y-%m-%d)" \
            hot_project/data/Github_DB.json \
            hot_project/data/report
