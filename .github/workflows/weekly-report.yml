name: weekly report

# 触发对齐原本机 crontab(周三 13:40 北京),

on:
  schedule:
    - cron: "43 5 * * 4"
  workflow_dispatch:
    inputs:
      top_n:
        description: "取前 N 个项目（留空用默认 100）"
        type: string
        default: ""
      growth_calc_days:
        description: "增长计算窗口天数（留空用默认 7）"
        type: string
        default: ""

permissions:
  contents: write

# 绝不用 pull_request_target:公开仓库存 PAT 和 LLM key 的前提是 fork 拿不到 secrets。
concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  report:
    if: github.repository == 'bachelor-dou/Agent-skils'
    runs-on: ubuntu-latest
    # 上期 64 分钟;留足余量应对限流退避,仍远低于 GitHub 6 小时上限
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4
        with:
          # 检出 main:每日快照攒在 main 上,是增长基线的唯一来源,拿不到就出不了榜。
          ref: main
        # 默认浅克隆:29MB 的 Github_DB.json 只下最新一版

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-ci.txt

      - name: 出榜
        env:
          GITHUB_TOKENS: ${{ secrets.GH_STAR_TOKENS }}
          # 只给 A、C 两个平台 = 两层顺序回退;其余平台 key 为空会被自动跳过,不必改 config。
          LLM_A_KEY: ${{ secrets.LLM_A_KEY }}
          LLM_C_KEY: ${{ secrets.LLM_C_KEY }}
          # 没配就是空串,代码跳过推送,不影响出榜
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          python -m hot_project.cron_weekly_report \
            ${{ inputs.top_n && format('--top-n {0}', inputs.top_n) || '' }} \
            ${{ inputs.growth_calc_days && format('--growth-days {0}', inputs.growth_calc_days) || '' }}

      - name: 提交并推送 DB 与报告
        run: |
          bash .github/scripts/commit_and_push.sh \
            "chore: weekly hot projects report $(date -u +%Y-%m-%d)" \
            hot_project/data/Github_DB.json \
            hot_project/report

      - name: 上传运行日志
        # logs/ 不入库,失败时靠这个 artifact 排查(控制台输出只留 90 天)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-logs
          path: hot_project/logs/
          retention-days: 30
          if-no-files-found: warn
