name: daily star snapshot

# 每日 star 快照跑在 GitHub 的机器上，直接提交到 main，本地 git pull 即可拿到。
# 快照是 N 天增长的唯一基线（star 时间戳接口 2026-06 起对外关闭），漏一天补不回来。
#
# 为什么按小时触发而不是每天一次：
#   GitHub 的 schedule 是 best-effort，2026 年社区实测漂移可达数小时（actions/runner#4468），
#   2026-07-09 还出过约 2% 的 run 直接启动失败的事故，且被跳过时不发任何通知。
#   脚本本身幂等（当天已有快照就秒退、一个请求都不发），所以按小时触发几乎零成本，
#   一天 24 次机会里任意一次成功就拿到当天快照。漏掉的那天是补不回来的
#   （今天无从得知昨天的 star 数），容错只能靠多给自己机会。
#   分钟取 :23 —— :00/:15/:30 是全平台定时任务的高峰批次，冷门分钟排队明显更短。
#
# 每天第一次尝试落在北京时间 08:23：快照按 UTC 日命名（与 DB 的 refreshed_at 同基准），
# 而 UTC 零点就是北京时间 8 点，所以 00:23 UTC 这一轮正是当天窗口的第一次机会。

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "当天已有快照也重新采集（用于验证「采集→提交→推送」整条链路）"
        type: boolean
        default: false

# 只用 schedule / workflow_dispatch 触发，绝不用 pull_request_target：
# 这是公开仓库存放 PAT 的前提——fork 的 PR 拿不到 secrets，外人无法借 token 干活。
permissions:
  contents: write

concurrency:
  group: star-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    # fork 出去的仓库不跑，免得白烧别人配额、也免得往上游推东西
    if: github.repository == 'bachelor-dou/Agent-skils'
    runs-on: ubuntu-latest
    # 发现三阶段约 25 分钟 + 采集约 10 分钟。
    # 发现那 25 分钟里九成在等限流：实测搜索撞的是按 IP 共享的**二级限流**，
    # 与 token 数无关（12 个不同账号的 token 会在同一刻一起 403，各自额度都还没用完），
    # 所以多放 token 不会缩短它。留足余量应对退避；公开仓库不计费，跑久点不心疼。
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          # CI 只在 snapshots 分支上活动，main 由人工 PR 合并把关。
          # 必须检出 snapshots 而非默认分支：过期快照清理要看到 snapshots 上已有的快照集合。
          # 注意 schedule 触发只认默认分支上的 workflow 文件，所以改这个 yaml 得合进 main 才生效。
          ref: snapshots
        # 默认浅克隆：29MB 的 Github_DB.json 只下最新一版，不拉历史

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-ci.txt

      # 幂等在脚本里：当天已有快照就秒退、一个请求都不发，所以这一步一天跑 24 次不心疼。
      - name: 发现新仓库 + 采集当天快照
        env:
          # secret 名不能以 GITHUB_ 开头（GitHub 保留前缀），故用 GH_STAR_TOKENS 再映射过来。
          # 逗号分隔，放几个都行：并发上限是 min(SNAPSHOT_MAX_CONCURRENCY, token 数)，
          # 池子在所有 token 间轮转、自动跳过被限流的那个，多余的 token 就是备用配额。
          GITHUB_TOKENS: ${{ secrets.GH_STAR_TOKENS }}
        run: |
          python -m hot_project.cron_daily_snapshot \
            ${{ inputs.force && '--force' || '' }}

      # DB 和快照一起提交:发现阶段往 DB 插了新仓库,而当天快照里已经含它们了。
      # 只提交快照会让下一轮从旧 DB 出发把同一批仓库再发现一遍。
      - name: 提交并推送快照与 DB
        run: |
          bash .github/scripts/commit_and_push.sh \
            "chore: star snapshot $(date -u +%Y-%m-%d)" \
            hot_project/data
