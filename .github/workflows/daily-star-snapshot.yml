name: daily snapshot

# 每日 star 快照:跑在 GitHub 机器上,直接提交回 main,本地 git pull 拿到。
# 快照是 N 天增长的唯一基线(star 时间戳接口 2026-06 起关闭),漏一天补不回来。
#
on:
  schedule:
    - cron: "23 0,6,12 * * *"
  workflow_dispatch:      # 手动触发一轮;当天已有快照仍会秒退(幂等在脚本里)

# 绝不用 pull_request_target:公开仓库存 PAT 的前提是 fork 的 PR 拿不到 secrets。
permissions:
  contents: write

# group 和周报共用,理由见 weekly-report.yml:两者都写 Github_DB.json,不能同时跑。
concurrency:
  group: main-data-write
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.repository == 'bachelor-dou/Agent-skils'
    runs-on: ubuntu-latest
    # 发现约 25 分钟(受按 IP 共享的二级限流约束) + 采集约 10 分钟,余量应对退避。
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          # 检出 main:代码和数据(快照/DB)都在 main,CI 直接把产物提交回 main;
          # 过期快照清理也要先看到 main 上已有的快照集合。人工改动走特性分支 PR。
          ref: main
        # 默认浅克隆:29MB 的 Github_DB.json 只下最新一版

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-ci.txt

      - name: 发现新仓库 + 采集当天快照
        env:
          # secret 名不能以 GITHUB_ 开头(GitHub 保留前缀),故用 GH_STAR_TOKENS 再映射。
          # 逗号分隔,多放的 token 是备用配额:池子自动轮转、跳过被限流的那个。
          GITHUB_TOKENS: ${{ secrets.GH_STAR_TOKENS }}
        run: python -m hot_project.cron_daily_snapshot

      # DB 和快照一起提交:发现阶段往 DB 插了新仓库,而当天快照里已经含它们了。
      # 只提交快照会让下一轮从旧 DB 出发把同一批仓库再发现一遍。
      - name: 提交并推送快照与 DB
        run: |
          bash .github/scripts/commit_and_push.sh \
            "chore: star snapshot $(date -u +%Y-%m-%d)" \
            hot_project/data
